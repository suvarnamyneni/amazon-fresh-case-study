<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop by Recipe prototype · Amazon Fresh · Suvarna Myneni</title>
<meta name="description" content="Clickable prototype of Shop by Recipe for Amazon Fresh, designed by Suvarna Myneni and used to review the flow before launch.">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14201c;--muted:#5d6b66;--bg:#eef3f0;--card:#fff;--line:#dbe4df;--fresh:#3c8a2e;--accent:#ff9900;--hot:rgba(0,138,255,.22);--hotb:#0a84ff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-weight:600}
header .crumb{color:var(--muted);font-size:14px}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px Inter,sans-serif;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--fresh)}.btn[disabled]{opacity:.4;cursor:default}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:20px}
aside h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;border:1px solid transparent;background:none;border-radius:12px;padding:8px;cursor:pointer;font:inherit;color:inherit}
.list button:hover{background:var(--bg)}
.list button.active{background:#e6f3e2;border-color:#b9dcb0}
.list img{width:44px;height:64px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);flex:none}
.list .n{font-size:12px;color:var(--muted)}.list .t{font-weight:600;font-size:14px}
.keys{margin-top:20px;font-size:13px;color:var(--muted);line-height:1.7}
kbd{font:600 11px Inter,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#fafafa;color:var(--ink)}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;min-height:0;overflow:auto}
.phone{position:relative;width:399px;height:836px;border-radius:52px;background:#111;padding:12px;box-shadow:0 30px 60px -20px rgba(20,32,28,.45),inset 0 0 0 2px #333;transform-origin:center center;flex:none}
.screen{position:relative;width:375px;height:812px;border-radius:40px;overflow-y:auto;overflow-x:hidden;background:#fff;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.canvas{position:relative;width:375px}
.canvas img{display:block;width:375px;height:auto;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;display:block;border-radius:6px;cursor:pointer;transition:background .15s,box-shadow .15s;outline:none}
.show .hs,.flash .hs{background:var(--hot);box-shadow:inset 0 0 0 2px var(--hotb)}
.hs:focus-visible{box-shadow:inset 0 0 0 3px var(--hotb)}
.caption{max-width:520px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;min-height:42px}
.caption b{color:var(--ink)}
.toast{position:absolute;left:50%;bottom:40px;transform:translate(-50%,20px);background:rgba(20,32,28,.92);color:#fff;font-size:13px;padding:10px 14px;border-radius:12px;width:300px;text-align:center;opacity:0;transition:.25s;pointer-events:none;z-index:5}
.toast.in{opacity:1;transform:translate(-50%,0)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (max-width:860px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:none}.list{grid-auto-flow:column;grid-auto-columns:200px;overflow-x:auto}.keys{display:none}}
</style>
<link rel="stylesheet" href="responsive-walkthrough.css?v=20261102a">
</head>
<body>
<header>
  <a href="./">← Case study</a><span class="crumb">Amazon Fresh · Shop by Recipe · clickable prototype by Suvarna Myneni</span>
  <span class="sp"></span>
  <button class="btn" id="back" disabled aria-label="Back">← Back</button>
  <button class="btn" id="toggle" aria-pressed="false">Show hotspots (H)</button>
</header>
<main>
  <aside>
    <h2>Screens</h2>
    <ul class="list" id="list"></ul>
    <div class="keys">
      <div><kbd>→</kbd> / <kbd>←</kbd> next / previous screen</div>
      <div><kbd>Backspace</kbd> or <kbd>B</kbd> go back</div>
      <div><kbd>H</kbd> show or hide hotspots</div>
      <div>Click anywhere else on the screen to flash the hotspots.</div>
    </div>
  </aside>
  <section class="stage" id="stage">
    <div class="phone" id="phone">
      <div class="screen" id="screen"><div class="canvas" id="canvas"></div></div>
      <div class="toast" id="toast"></div>
    </div>
    <p class="caption" id="caption"></p>
  </section>
</main>
<script src="screens.js"></script>
<script>
(function(){
const S=window.SCREENS, byId=Object.fromEntries(S.map(s=>[s.id,s]));
const $=id=>document.getElementById(id);
const list=$('list'),canvas=$('canvas'),screen=$('screen'),cap=$('caption'),back=$('back'),tog=$('toggle'),toast=$('toast'),phone=$('phone');
let cur=null,hist=[],show=false,flashT,toastT;
S.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML=`<button data-id="${s.id}"><img src="img/${s.file.replace(".webp","-thumb.webp")}" alt="" loading="lazy"><span><span class="n">${String(i+1).padStart(2,'0')}</span><br><span class="t">${s.name}</span></span></button>`;li.firstChild.onclick=()=>go(s.id,true);list.appendChild(li)});
function render(id){
  const s=byId[id];cur=id;
  canvas.innerHTML=`<img src="img/${s.file}" width="375" height="${s.h}" alt="${s.name} screen">`;
  canvas.style.height=s.h+'px';
  s.hotspots.forEach(h=>{const a=document.createElement('a');a.className='hs';a.href='#'+(h.to[0]=='@'?id:h.to);a.title=h.label;a.setAttribute('aria-label',h.label);
    Object.assign(a.style,{left:h.x+'px',top:h.y+'px',width:h.w+'px',height:h.h+'px'});
    a.onclick=e=>{e.preventDefault();e.stopPropagation();if(h.to=='@toast'){say('Checkout is outside the scope of this prototype.');return}go(h.to,true)};canvas.appendChild(a)});
  screen.scrollTop=0;
  const i=S.indexOf(s);
  cap.innerHTML=`<b>${i+1} / ${S.length} · ${s.name}</b><br>${s.note} <span style="opacity:.7">(${s.hotspots.length} hotspots)</span>`;
  document.querySelectorAll('.list button').forEach(b=>b.classList.toggle('active',b.dataset.id==id));
  back.disabled=!hist.length;
  document.title=s.name+' · Shop by Recipe prototype';
}
function go(id,push){if(!byId[id])return;if(push&&cur&&cur!==id)hist.push(cur);history.replaceState(null,'','#'+id);render(id)}
function goBack(){if(!hist.length)return;const p=hist.pop();history.replaceState(null,'','#'+p);render(p)}
function step(d){const i=S.findIndex(s=>s.id==cur);const j=(i+d+S.length)%S.length;go(S[j].id,true)}
function setShow(v){show=v;screen.classList.toggle('show',v);tog.classList.toggle('on',v);tog.setAttribute('aria-pressed',v);tog.textContent=(v?'Hide':'Show')+' hotspots (H)'}
function say(t){toast.textContent=t;toast.classList.add('in');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('in'),2200)}
canvas.addEventListener('click',()=>{if(show)return;screen.classList.add('flash');clearTimeout(flashT);flashT=setTimeout(()=>screen.classList.remove('flash'),600)});
back.onclick=goBack;tog.onclick=()=>setShow(!show);
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k=='ArrowRight'){e.preventDefault();step(1)}else if(k=='ArrowLeft'){e.preventDefault();step(-1)}
  else if(k=='h'||k=='H')setShow(!show);else if(k=='Backspace'||k=='b'||k=='B'||k=='Escape'){e.preventDefault();goBack()}
  else if(k=='ArrowDown'){screen.scrollBy({top:120});e.preventDefault()}else if(k=='ArrowUp'){screen.scrollBy({top:-120});e.preventDefault()}});
function fit(){const st=$('stage');const avail=st.clientHeight-90, aw=st.clientWidth-40;const sc=Math.min(1,avail/836,aw/399);phone.style.transform=`scale(${sc})`;phone.style.margin=`${-(836*(1-sc))/2}px ${-(399*(1-sc))/2}px`}
addEventListener('resize',fit);fit();
const start=location.hash.slice(1);go(byId[start]?start:'landing',false);
})();
</script>
</body>
</html>
